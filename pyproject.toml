[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "earnings-alpha"
version = "0.1.0"
description = "Investigación de estrategias sobre fundamentales y eventos de resultados en el S&P 500"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15",
    "requests>=2.31",
    "scipy>=1.11",
]

[project.optional-dependencies]
stats = ["statsmodels>=0.14", "scikit-learn>=1.4"]
providers = ["yfinance>=0.2.40"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
earnings-alpha = "earnings_alpha.cli:main"

[tool.setuptools.packages.find]
include = ["earnings_alpha*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "network: requiere acceso a red real (excluido por defecto)",
    "slow: test lento",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "N", "PD"]
ignore = ["PD901", "E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
